name: Check image changes

on:
  workflow_call:
    inputs:
      image-path:
        required: true
        type: string
      workflow-path:
        required: true
        type: string
    outputs:
      changed:
        value: ${{ jobs.changes.outputs.changed }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check image update scripts
        run: bash .github/scripts/tests/image-updates.sh

      - name: Check affected files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          IMAGE_PATH: ${{ inputs.image-path }}
          WORKFLOW_PATH: ${{ inputs.workflow-path }}
        run: bash .github/scripts/image-changed.sh
